<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dzeline Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        navy: '#060d1f', surface: '#0b1528', card: '#0e1d35', border: '#1a2d4a', primary: '#0ea5e9'
      }}}
    }
  </script>
  <style>
    body { background: #060d1f; color: #e2e8f0; font-family: system-ui, sans-serif; }
    input, select, textarea { color-scheme: dark; }
  </style>
</head>
<body class="min-h-screen">

<!-- LOGIN -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-[#0e1d35] border border-[#1a2d4a] rounded-2xl p-8 w-full max-w-sm shadow-2xl">
    <h1 class="text-2xl font-bold text-white mb-1">Dzeline Admin</h1>
    <p class="text-slate-400 text-sm mb-6">Tenant management dashboard</p>
    <label class="block text-xs font-semibold text-slate-400 mb-2">Admin Secret</label>
    <input id="secretInput" type="password" placeholder="Enter admin secret"
      class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500 mb-4"
      onkeydown="if(event.key==='Enter') signIn()" />
    <div id="loginError" class="text-red-400 text-xs mb-3 hidden"></div>
    <button onclick="signIn()" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-3 rounded-xl text-sm transition">Sign In</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
  <header class="bg-[#0b1528] border-b border-[#1a2d4a] px-6 py-4 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <span class="text-white font-bold text-lg">Dzeline Admin</span>
      <span id="tenantCount" class="bg-[#1a2d4a] text-sky-400 text-xs font-semibold px-2.5 py-1 rounded-full"></span>
    </div>
    <div class="flex gap-3">
      <button onclick="openCreate()" class="bg-sky-500 hover:bg-sky-400 text-white text-sm font-bold px-4 py-2 rounded-xl transition">+ New Tenant</button>
      <button onclick="signOut()" class="text-slate-400 hover:text-white text-sm px-3 py-2 rounded-xl border border-[#1a2d4a] hover:border-slate-500 transition">Sign out</button>
    </div>
  </header>

  <main class="p-6 max-w-7xl mx-auto">
    <div id="tenantGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    <div id="emptyState" class="hidden text-center py-24 text-slate-500">No tenants yet — create the first one.</div>
    <div id="loadError" class="hidden text-center py-24 text-red-400"></div>
  </main>
</div>

<!-- CREATE MODAL -->
<div id="createModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
  <div class="bg-[#0e1d35] border border-[#1a2d4a] rounded-2xl p-6 w-full max-w-md shadow-2xl">
    <h2 class="text-lg font-bold text-white mb-4">New Tenant</h2>
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Shop Name *</label>
        <input id="c_name" type="text" placeholder="Mama Njeri's Duka"
          class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Plan</label>
        <select id="c_plan" class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
          <option value="trial">Trial</option>
          <option value="starter">Starter</option>
          <option value="pro">Pro</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Owner Name</label>
        <input id="c_owner_name" type="text" placeholder="Jane Kamau"
          class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
      </div>
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block text-xs font-semibold text-slate-400 mb-1">Phone</label>
          <input id="c_owner_phone" type="tel" placeholder="0712345678"
            class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
        </div>
        <div class="flex-1">
          <label class="block text-xs font-semibold text-slate-400 mb-1">Email</label>
          <input id="c_owner_email" type="email" placeholder="jane@email.com"
            class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Notes</label>
        <textarea id="c_notes" rows="2" placeholder="Setup notes, special config, how you met them..."
          class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 resize-none"></textarea>
      </div>
    </div>
    <div id="createError" class="text-red-400 text-xs mt-3 hidden"></div>
    <div class="flex gap-3 mt-5">
      <button onclick="closeCreate()" class="flex-1 py-2.5 rounded-xl text-sm text-slate-400 hover:text-white hover:bg-[#1a2d4a] transition">Cancel</button>
      <button onclick="submitCreate()" class="flex-1 bg-sky-500 hover:bg-sky-400 text-white font-bold py-2.5 rounded-xl text-sm transition">Create &amp; Get Key</button>
    </div>
  </div>
</div>

<!-- API KEY MODAL -->
<div id="keyModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
  <div class="bg-[#0e1d35] border border-[#1a2d4a] rounded-2xl p-6 w-full max-w-md shadow-2xl">
    <h2 class="text-lg font-bold text-white mb-1">API Key — Copy Now</h2>
    <p class="text-slate-400 text-xs mb-4">Shown <strong class="text-amber-400">once only</strong>. Paste into the client's SetupWizard before closing.</p>
    <div class="bg-[#060d1f] border border-amber-500/40 rounded-xl p-4 flex items-start gap-3 mb-3">
      <code id="keyDisplay" class="text-amber-400 text-sm break-all flex-1 leading-relaxed"></code>
      <button onclick="copyKey()" class="text-sky-400 hover:text-sky-300 text-xs font-semibold whitespace-nowrap mt-0.5">Copy</button>
    </div>
    <div id="keyCopied" class="hidden text-green-400 text-xs mb-3">Copied to clipboard!</div>
    <button onclick="closeKey()" class="w-full py-2.5 bg-[#1a2d4a] hover:bg-[#243d5a] text-white rounded-xl text-sm font-semibold transition">Done</button>
  </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
  <div class="bg-[#0e1d35] border border-[#1a2d4a] rounded-2xl p-6 w-full max-w-md shadow-2xl max-h-[92vh] overflow-y-auto">
    <h2 class="text-lg font-bold text-white mb-4">Edit Tenant</h2>
    <input type="hidden" id="e_id" />
    <input type="hidden" id="e_tenant_name_ref" />
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Shop Name</label>
        <input id="e_name" type="text"
          class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
      </div>
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block text-xs font-semibold text-slate-400 mb-1">Plan</label>
          <select id="e_plan" class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            <option value="trial">Trial</option>
            <option value="starter">Starter</option>
            <option value="pro">Pro</option>
          </select>
        </div>
        <div class="flex-1">
          <label class="block text-xs font-semibold text-slate-400 mb-1">Status</label>
          <select id="e_active" class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            <option value="true">Active</option>
            <option value="false">Suspended</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Billing Expiry</label>
        <input id="e_billing" type="date"
          class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
        <p class="text-xs text-slate-500 mt-1">Leave blank = no expiry</p>
      </div>
      <div class="border-t border-[#1a2d4a] pt-3">
        <p class="text-xs font-semibold text-slate-400 mb-2">Owner Contact</p>
        <div class="space-y-2">
          <input id="e_owner_name" type="text" placeholder="Owner name"
            class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
          <div class="flex gap-2">
            <input id="e_owner_phone" type="tel" placeholder="Phone"
              class="flex-1 bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
            <input id="e_owner_email" type="email" placeholder="Email"
              class="flex-1 bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500" />
          </div>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Notes</label>
        <textarea id="e_notes" rows="3"
          class="w-full bg-[#060d1f] border border-[#1a2d4a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 resize-none"></textarea>
      </div>
    </div>
    <div id="editError" class="text-red-400 text-xs mt-3 hidden"></div>
    <div class="flex gap-2 mt-5">
      <button onclick="closeEdit()" class="py-2.5 px-4 rounded-xl text-sm text-slate-400 hover:text-white hover:bg-[#1a2d4a] transition">Cancel</button>
      <button onclick="rotateKey()" class="py-2.5 px-4 rounded-xl text-sm text-amber-400 border border-amber-500/30 hover:bg-amber-500/10 transition">Rotate Key</button>
      <button onclick="submitEdit()" class="flex-1 bg-sky-500 hover:bg-sky-400 text-white font-bold py-2.5 rounded-xl text-sm transition">Save Changes</button>
    </div>
  </div>
</div>

<script>
  const API = '';
  let SECRET = sessionStorage.getItem('dzl_admin') || '';
  let TENANTS = [];

  function api(path, opts) {
    opts = opts || {};
    return fetch(API + path, Object.assign({}, opts, {
      headers: Object.assign({ 'X-Admin-Secret': SECRET, 'Content-Type': 'application/json' }, opts.headers || {}),
    }));
  }

  function showErr(el, msg) { el.textContent = msg; el.classList.remove('hidden'); }
  function hideErr(el) { el.classList.add('hidden'); }

  async function apiErrorText(r) {
    var detail = '';
    try {
      var data = await r.json();
      if (data && data.detail) detail = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
    } catch (e) {}
    return r.status + (detail ? ' — ' + detail : ' ' + r.statusText);
  }

  async function signIn() {
    SECRET = document.getElementById('secretInput').value.trim();
    var err = document.getElementById('loginError');
    if (!SECRET) { showErr(err, 'Enter the admin secret.'); return; }
    var r = await api('/admin/tenants');
    if (r.status === 401 || r.status === 403) { showErr(err, 'Wrong secret.'); return; }
    if (!r.ok) { showErr(err, 'Connection failed: ' + await apiErrorText(r)); return; }
    sessionStorage.setItem('dzl_admin', SECRET);
    showDashboard(await r.json());
  }

  function signOut() {
    sessionStorage.removeItem('dzl_admin');
    SECRET = '';
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('secretInput').value = '';
  }

  function showDashboard(tenants) {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    renderTenants(tenants);
  }

  async function loadTenants() {
    var r = await api('/admin/tenants');
    if (!r.ok) {
      var el = document.getElementById('loadError');
      el.textContent = 'Failed to load tenants: ' + await apiErrorText(r);
      el.classList.remove('hidden');
      return;
    }
    renderTenants(await r.json());
  }

  function renderTenants(tenants) {
    TENANTS = tenants;
    var grid  = document.getElementById('tenantGrid');
    var empty = document.getElementById('emptyState');
    document.getElementById('loadError').classList.add('hidden');
    document.getElementById('tenantCount').textContent =
      tenants.length + ' tenant' + (tenants.length !== 1 ? 's' : '');
    if (!tenants.length) { empty.classList.remove('hidden'); grid.innerHTML = ''; return; }
    empty.classList.add('hidden');
    grid.innerHTML = tenants.map(tenantCard).join('');
  }

  var planBadge = {
    trial:   'text-slate-400 bg-slate-400/10',
    starter: 'text-sky-400 bg-sky-400/10',
    pro:     'text-emerald-400 bg-emerald-400/10',
  };

  function fmt(n) {
    return n > 0 ? 'KES ' + Number(n).toLocaleString('en-KE', { maximumFractionDigits: 0 }) : '—';
  }
  function fmtDate(ms) {
    return ms ? new Date(ms).toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function tenantCard(t) {
    var badge = planBadge[t.plan] || planBadge.trial;
    var statusDot = t.active
      ? '<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span><span class="text-emerald-400">Active</span>'
      : '<span class="w-2 h-2 rounded-full bg-red-400 inline-block"></span><span class="text-red-400">Suspended</span>';

    var parts = [];
    if (t.owner_name)  parts.push('<span class="text-white font-medium">' + esc(t.owner_name) + '</span>');
    if (t.owner_phone) parts.push('<a href="tel:' + esc(t.owner_phone) + '" class="text-sky-400 hover:underline">' + esc(t.owner_phone) + '</a>');
    if (t.owner_email) parts.push('<a href="mailto:' + esc(t.owner_email) + '" class="text-sky-400 hover:underline">' + esc(t.owner_email) + '</a>');
    var contact = parts.length
      ? '<div class="text-sm flex flex-wrap items-center gap-x-1 gap-y-1">' + parts.join('<span class="text-slate-600 mx-0.5">·</span>') + '</div>'
      : '<p class="text-xs text-slate-600 italic">No owner contact recorded</p>';

    var notes = t.notes
      ? '<p class="text-slate-400 text-xs leading-relaxed border-l-2 border-[#1a2d4a] pl-3 italic">' + esc(t.notes) + '</p>'
      : '';

    var billing = t.billing_cycle_end
      ? 'Billing until ' + fmtDate(t.billing_cycle_end)
      : 'No billing expiry';

    return '<div class="bg-[#0e1d35] border border-[#1a2d4a] rounded-2xl p-5 flex flex-col gap-3 hover:border-sky-500/30 transition">'
      + '<div class="flex items-start justify-between gap-2">'
        + '<div>'
          + '<h3 class="text-white font-bold text-base leading-tight">' + esc(t.name) + '</h3>'
          + '<div class="flex items-center gap-2 mt-1.5 text-xs">'
            + '<div class="flex items-center gap-1">' + statusDot + '</div>'
            + '<span class="text-slate-600">·</span>'
            + '<span class="' + badge + ' text-xs font-semibold px-2 py-0.5 rounded-full capitalize">' + t.plan + '</span>'
          + '</div>'
        + '</div>'
        + '<button onclick="openEdit(' + t.id + ')" class="text-slate-400 hover:text-white text-xs bg-[#1a2d4a] hover:bg-[#243d5a] px-3 py-1.5 rounded-lg transition whitespace-nowrap">Edit</button>'
      + '</div>'
      + contact
      + notes
      + '<div class="grid grid-cols-3 gap-2 border-t border-[#1a2d4a] pt-3">'
        + '<div class="text-center"><div class="text-white font-bold">' + (t.txn_count || 0) + '</div><div class="text-slate-500 text-xs">Sales</div></div>'
        + '<div class="text-center"><div class="text-white font-bold text-sm">' + fmt(t.total_revenue) + '</div><div class="text-slate-500 text-xs">Revenue</div></div>'
        + '<div class="text-center"><div class="text-white font-bold text-xs">' + fmtDate(t.last_sync_at) + '</div><div class="text-slate-500 text-xs">Last sync</div></div>'
      + '</div>'
      + '<div class="text-xs text-slate-600 flex justify-between border-t border-[#1a2d4a] pt-2">'
        + '<span>' + billing + '</span><span>ID #' + t.id + '</span>'
      + '</div>'
    + '</div>';
  }

  // ── Create ──────────────────────────────────────────────────────────────────
  function openCreate() {
    hideErr(document.getElementById('createError'));
    document.getElementById('createModal').classList.remove('hidden');
    setTimeout(function() { document.getElementById('c_name').focus(); }, 50);
  }
  function closeCreate() {
    document.getElementById('createModal').classList.add('hidden');
    ['c_name','c_owner_name','c_owner_phone','c_owner_email','c_notes'].forEach(function(id) {
      document.getElementById(id).value = '';
    });
    document.getElementById('c_plan').value = 'trial';
  }

  async function submitCreate() {
    var name = document.getElementById('c_name').value.trim();
    var err  = document.getElementById('createError');
    if (!name) { showErr(err, 'Shop name is required.'); return; }
    hideErr(err);
    var body = {
      name: name,
      plan: document.getElementById('c_plan').value,
      owner_name:  document.getElementById('c_owner_name').value.trim()  || null,
      owner_phone: document.getElementById('c_owner_phone').value.trim() || null,
      owner_email: document.getElementById('c_owner_email').value.trim() || null,
      notes:       document.getElementById('c_notes').value.trim()       || null,
    };
    var r = await api('/admin/tenants', { method: 'POST', body: JSON.stringify(body) });
    if (!r.ok) { showErr(err, 'Failed to create tenant: ' + await apiErrorText(r)); return; }
    var data = await r.json();
    closeCreate();
    showKey(data.api_key);
    loadTenants();
  }

  // ── API Key ──────────────────────────────────────────────────────────────────
  function showKey(key) {
    document.getElementById('keyDisplay').textContent = key;
    document.getElementById('keyCopied').classList.add('hidden');
    document.getElementById('keyModal').classList.remove('hidden');
  }
  function closeKey() { document.getElementById('keyModal').classList.add('hidden'); }
  function copyKey() {
    navigator.clipboard.writeText(document.getElementById('keyDisplay').textContent);
    document.getElementById('keyCopied').classList.remove('hidden');
  }

  // ── Edit ────────────────────────────────────────────────────────────────────
  function openEdit(id) {
    var t = TENANTS.find(function(x) { return x.id === id; });
    if (!t) return;
    document.getElementById('e_id').value              = t.id;
    document.getElementById('e_tenant_name_ref').value = t.name;
    document.getElementById('e_name').value            = t.name;
    document.getElementById('e_plan').value            = t.plan;
    document.getElementById('e_active').value          = String(t.active);
    document.getElementById('e_owner_name').value      = t.owner_name  || '';
    document.getElementById('e_owner_phone').value     = t.owner_phone || '';
    document.getElementById('e_owner_email').value     = t.owner_email || '';
    document.getElementById('e_notes').value           = t.notes       || '';
    document.getElementById('e_billing').value = t.billing_cycle_end
      ? new Date(t.billing_cycle_end).toISOString().split('T')[0] : '';
    hideErr(document.getElementById('editError'));
    document.getElementById('editModal').classList.remove('hidden');
  }
  function closeEdit() { document.getElementById('editModal').classList.add('hidden'); }

  async function submitEdit() {
    var id  = document.getElementById('e_id').value;
    var err = document.getElementById('editError');
    hideErr(err);
    var billingStr = document.getElementById('e_billing').value;
    var body = {
      name:    document.getElementById('e_name').value.trim(),
      plan:    document.getElementById('e_plan').value,
      active:  document.getElementById('e_active').value === 'true',
      billing_cycle_end: billingStr ? new Date(billingStr).getTime() : null,
      owner_name:  document.getElementById('e_owner_name').value.trim()  || null,
      owner_phone: document.getElementById('e_owner_phone').value.trim() || null,
      owner_email: document.getElementById('e_owner_email').value.trim() || null,
      notes:       document.getElementById('e_notes').value.trim()       || null,
    };
    var r = await api('/admin/tenants/' + id, { method: 'PATCH', body: JSON.stringify(body) });
    if (!r.ok) { showErr(err, 'Failed to save changes: ' + await apiErrorText(r)); return; }
    closeEdit();
    loadTenants();
  }

  async function rotateKey() {
    var id   = document.getElementById('e_id').value;
    var name = document.getElementById('e_tenant_name_ref').value;
    if (!confirm('Rotate the API key for "' + name + '"?\n\nThe old key stops working immediately.')) return;
    var r = await api('/admin/tenants/' + id + '/rotate-key', { method: 'POST' });
    if (!r.ok) { showErr(document.getElementById('editError'), 'Failed to rotate key: ' + await apiErrorText(r)); return; }
    var data = await r.json();
    closeEdit();
    showKey(data.api_key);
  }

  // ── Boot ────────────────────────────────────────────────────────────────────
  if (SECRET) {
    api('/admin/tenants').then(function(r) {
      if (!r.ok) { SECRET = ''; sessionStorage.removeItem('dzl_admin'); return; }
      r.json().then(showDashboard);
    });
  }
</script>
</body>
</html>
