# Required by AGP 8: the project depends on androidx.appcompat, and without
# this flag the build fails outright with "This project uses AndroidX
# dependencies, but the 'android.useAndroidX' property is not enabled."
# There was no gradle.properties at all, which is a second reason the APK
# workflow could never have produced a build.
android.useAndroidX=true

# No android.support.* dependencies here, so nothing needs rewriting.
android.enableJetifier=false

# AGP 8 needs headroom; the 512m default leads to OOM during dexing.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.caching=true
kotlin.code.style=official
