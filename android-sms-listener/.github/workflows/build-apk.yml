name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-sms-listener/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-sms-listener

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Debug first: it is signed with the standard debug key, so this is the
      # artifact that can actually be installed on a shop phone. The release
      # APK below is unsigned and needs apksigner before it will install.
      - name: Build debug APK (installable)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dzeline-sms-listener-${{ github.run_number }}
          path: |
            android-sms-listener/app/build/outputs/apk/debug/*.apk
            android-sms-listener/app/build/outputs/apk/release/*.apk
          retention-days: 30
