name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-sms-listener/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-sms-listener

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dzeline-sms-listener-${{ github.run_number }}
          path: android-sms-listener/app/build/outputs/apk/release/*.apk
          retention-days: 30
