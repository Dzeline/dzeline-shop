services:
  - type: web
    name: dzeline-api
    runtime: python
    rootDir: backend
    buildCommand: apt-get install -y -qq libgomp1 libglib2.0-0 && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard — points to Neon PostgreSQL
      - key: MPESA_ENV
        value: production
      - key: MPESA_SHORTCODE_TYPE
        value: paybill
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ETIMS_ENV
        value: production
      - key: ETIMS_TIN
        sync: false
      - key: ETIMS_BHF_ID
        value: "00"
      - key: ETIMS_DEVICE_SERIAL
        sync: false
      - key: SMS_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: PADDLE_HOME
        value: /opt/paddle_models
      - key: PYTHON_VERSION
        value: "3.11"
