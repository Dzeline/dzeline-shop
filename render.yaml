services:
  - type: web
    name: dzeline-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dzeline-db
          property: connectionString
      - key: MPESA_ENV
        value: production
      - key: MPESA_SHORTCODE_TYPE
        value: paybill
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ETIMS_ENV
        value: production
      - key: ETIMS_TIN
        sync: false
      - key: ETIMS_BHF_ID
        value: "00"
      - key: ETIMS_DEVICE_SERIAL
        sync: false

databases:
  - name: dzeline-db
    plan: free
    databaseName: dzeline
    user: dzeline
